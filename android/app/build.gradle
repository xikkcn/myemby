apply plugin: 'com.android.application'

android {
    namespace "com.myemby.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.myemby.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // 自签名，方便直接分发给别人安装；开源项目固定密钥，便于后续版本覆盖安装
    signingConfigs {
        release {
            storeFile file("myemby.keystore")
            storePassword "myemby123"
            keyAlias "myemby"
            keyPassword "myemby123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    /**
     * 两个维度交叉出六个安装包：
     *   androidVersion —— modern(Android 5.1+) / legacy(兼容 Android 5.0 的老设备)
     *   device          —— phone(手机平板，一份通用包) / tv64(64 位电视) / tv32(32 位电视)
     *
     * 电视端单独拆成 64 位和 32 位两个包，是因为老电视盒子多为 32 位 ARM，
     * 装 64 位包会直接失败；反过来新盒子装 32 位包又浪费性能。
     * 手机端两种架构合在一个包里，省得用户选错。
     *
     * 电视端锁定横屏并带 Leanback 启动器，手机端跟随设备旋转。
     */
    flavorDimensions "androidVersion", "device"

    productFlavors {
        modern {
            dimension "androidVersion"
            minSdkVersion 22
            targetSdkVersion 34
        }
        legacy {
            dimension "androidVersion"
            minSdkVersion 21
            targetSdkVersion 28
        }
        phone {
            dimension "device"
            // 手机 / 平板：跟随设备自动旋转，包里同时带 arm64 与 arm32 核心
            manifestPlaceholders = [orientation: "unspecified"]
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
        tv64 {
            dimension "device"
            // 电视包与手机包用不同 applicationId，两者可以同时装在一个设备上互不覆盖
            applicationIdSuffix ".tv"
            // 64 位电视盒子 / 智能电视：强制横屏 + 电视启动器
            manifestPlaceholders = [orientation: "sensorLandscape"]
            ndk { abiFilters 'arm64-v8a' }
        }
        tv32 {
            dimension "device"
            applicationIdSuffix ".tv"
            // 32 位老电视盒子：强制横屏 + 电视启动器
            manifestPlaceholders = [orientation: "sensorLandscape"]
            ndk { abiFilters 'armeabi-v7a' }
        }
    }

    // 输出文件名：带上设备类型与架构，一眼能看出该装哪个
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // flavorName 是各维度组合后的字符串，例如 modernTv64 / legacyPhone
            def name = variant.flavorName.toLowerCase()
            def dev
            if (name.contains('tv64')) dev = 'tv-arm64'
            else if (name.contains('tv32')) dev = 'tv-arm32'
            else dev = 'phone'
            def ver = name.contains('legacy') ? '-legacy21' : ''
            outputFileName = "myemby-${variant.versionName}-${dev}${ver}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // 代理核心以 lib*.so 形式放在 jniLibs。
        // useLegacyPackaging=true 表示安装时解压到 nativeLibraryDir —— 既能被压缩（APK 小一半以上），
        // 解压后也带可执行权限，程序可以直接 exec 它。
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // ProxyController：把 myemby 自己 WebView 的流量指向本地代理端口
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
